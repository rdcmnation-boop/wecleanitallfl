# Keeps the free Supabase project awake (free projects pause after 7 days without activity).
# Reads the public URL + anon key from app/config.js, so no secrets are needed. Does nothing in demo mode.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 14 * * 1,4"   # Mon & Thu
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep -oE 'SUPABASE_URL: *"[^"]*"' app/config.js | sed -E 's/.*"([^"]*)"/\1/')
          KEY=$(grep -oE 'SUPABASE_ANON_KEY: *"[^"]*"' app/config.js | sed -E 's/.*"([^"]*)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Demo mode, nothing to ping."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
